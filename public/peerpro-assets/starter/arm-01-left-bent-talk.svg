<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 190" width="110" height="190">
  <defs>
    <!-- Skin -->
    <linearGradient id="talkSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <!-- Blazer Navy -->
    <linearGradient id="talkNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Bent Arm Sleeve (Shoulder pivot at 75, 25) -->
  <path d="M75,15 C90,15 95,28 92,42 L80,105 C75,122 58,135 44,142 L32,125 C45,118 56,108 60,95 L68,35 C68,22 62,15 75,15 Z"
        fill="url(#talkNavy)" stroke="#334155" stroke-width="1.8" />

  <!-- Forearm section extending toward chest -->
  <path d="M32,125 L12,110 L18,92 L42,106 Z" fill="url(#talkNavy)" stroke="#334155" stroke-width="1.8" />

  <!-- Elbow crease -->
  <path d="M46,112 C52,118 56,124 54,132" stroke="#090d16" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- White Cuff -->
  <path d="M12,110 L18,92 L22,94 L16,112 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

  <!-- Open Conversational Gesturing Anime Hand -->
  <g transform="translate(0, 72)">
    <path d="M16,24 C14,14 18,6 26,0 C30,2 32,8 26,16 L22,24 Z" fill="url(#talkSkin)" stroke="#d97706" stroke-width="1.2" />
    <path d="M22,24 C20,18 24,10 32,6 C36,8 36,14 30,22 L26,26 Z" fill="url(#talkSkin)" stroke="#d97706" stroke-width="1.2" />
    <path d="M18,34 C12,30 14,24 20,24 C24,24 28,30 26,36 Z" fill="url(#talkSkin)" stroke="#d97706" stroke-width="1.2" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="160" height="260">
  <defs>
    <linearGradient id="chairWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="chairLegs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="chairShadow" x="-10" y="235" width="180" height="25" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="80" cy="248" rx="65" ry="7" fill="#0f172a" opacity="0.32" filter="url(#chairShadow)"/>

  <!-- Rear Backrest Support Tubes -->
  <g stroke="url(#chairLegs)" stroke-width="7" stroke-linecap="round">
    <line x1="38" y1="20" x2="38" y2="140"/>
    <line x1="122" y1="20" x2="122" y2="140"/>
  </g>

  <!-- Curved Plywood Backrest -->
  <rect x="22" y="16" width="116" height="42" rx="6" fill="url(#chairWood)"/>
  <rect x="22" y="16" width="116" height="3" rx="1" fill="#fde68a" opacity="0.5"/>
  <rect x="22" y="55" width="116" height="3" rx="1" fill="#78350f"/>
  <!-- Rivets / Mounting Screws on Backrest -->
  <circle cx="38" cy="37" r="3" fill="#cbd5e1"/>
  <circle cx="38" cy="37" r="1.5" fill="#334155"/>
  <circle cx="122" cy="37" r="3" fill="#cbd5e1"/>
  <circle cx="122" cy="37" r="1.5" fill="#334155"/>

  <!-- Rear Legs (Extending from seat to floor) -->
  <g stroke="#1e293b" stroke-width="7" stroke-linecap="round">
    <line x1="38" y1="140" x2="32" y2="246"/>
    <line x1="122" y1="140" x2="128" y2="246"/>
    <!-- Rear Crossbar -->
    <line x1="35" y1="205" x2="125" y2="205" stroke-width="5"/>
  </g>

  <!-- Front Legs -->
  <g stroke="url(#chairLegs)" stroke-width="8" stroke-linecap="round">
    <line x1="28" y1="142" x2="22" y2="248"/>
    <line x1="132" y1="142" x2="138" y2="248"/>
    <!-- Front Crossbar -->
    <line x1="25" y1="210" x2="135" y2="210" stroke-width="6"/>
  </g>

  <!-- Rubber Foot Caps -->
  <rect x="17" y="244" width="10" height="6" rx="2" fill="#0f172a"/>
  <rect x="133" y="244" width="10" height="6" rx="2" fill="#0f172a"/>
  <rect x="27" y="242" width="10" height="5" rx="2" fill="#0f172a" opacity="0.8"/>
  <rect x="123" y="242" width="10" height="5" rx="2" fill="#0f172a" opacity="0.8"/>

  <!-- Seat Shadow on frame -->
  <ellipse cx="80" cy="142" rx="60" ry="6" fill="#0f172a" opacity="0.25"/>

  <!-- Contoured Plywood Seat -->
  <rect x="18" y="128" width="124" height="18" rx="5" fill="url(#chairWood)"/>
  <rect x="18" y="128" width="124" height="2.5" rx="1" fill="#fde68a" opacity="0.55"/>
  <rect x="18" y="143.5" width="124" height="2.5" rx="1" fill="#78350f"/>
</svg>

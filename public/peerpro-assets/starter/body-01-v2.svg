<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <!-- Skin -->
    <linearGradient id="bodySkinV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <!-- Blazer Base Navy -->
    <linearGradient id="blazerNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Blazer Cel Shadow -->
    <linearGradient id="blazerShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.0" />
    </linearGradient>
    <!-- Tie Red Gradient -->
    <linearGradient id="tieRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <!-- Pants Slate -->
    <linearGradient id="pantsSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Neck -->
  <path d="M136,78 C136,78 135,108 135,110 L165,110 C165,108 164,78 164,78 Z" fill="url(#bodySkinV2)" stroke="#d97706" stroke-width="1.2" />
  <!-- Neck shadow cast by chin -->
  <path d="M136,80 C145,92 155,92 164,80 L165,92 C155,100 145,100 135,92 Z" fill="#f59e0b" opacity="0.3" />

  <!-- Inner Shirt & Collar -->
  <polygon points="135,102 165,102 150,170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <!-- Shirt collar flaps -->
  <polygon points="130,102 145,102 138,124" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <polygon points="170,102 155,102 162,124" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Red School Tie & Tie Clip -->
  <polygon points="146,118 154,118 156,178 150,188 144,178" fill="url(#tieRed)" stroke="#7f1d1d" stroke-width="1" />
  <rect x="146" y="142" width="9" height="3" rx="1" fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />

  <!-- Torso / Tailored Blazer -->
  <path d="M72,128 C96,104 108,102 150,102 C192,102 204,104 228,128 L214,342 C180,348 120,348 86,342 Z"
        fill="url(#blazerNavy)" stroke="#334155" stroke-width="1.8" />

  <!-- Blazer Lapels -->
  <path d="M112,103 L134,180 L118,182 L96,128 Z" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
  <path d="M188,103 L166,180 L182,182 L204,128 Z" fill="#0f172a" stroke="#475569" stroke-width="1.2" />

  <!-- Blazer Center Buttons & Seam -->
  <line x1="150" y1="184" x2="150" y2="344" stroke="#090d16" stroke-width="1.5" />
  <circle cx="150" cy="215" r="3" fill="#f8fafc" stroke="#475569" stroke-width="1" />
  <circle cx="150" cy="255" r="3" fill="#f8fafc" stroke="#475569" stroke-width="1" />
  <circle cx="150" cy="295" r="3" fill="#f8fafc" stroke="#475569" stroke-width="1" />

  <!-- Pocket Flaps -->
  <rect x="94" y="278" width="34" height="6" rx="2" fill="#090d16" stroke="#475569" stroke-width="1" />
  <rect x="172" y="278" width="34" height="6" rx="2" fill="#090d16" stroke="#475569" stroke-width="1" />

  <!-- Left Arm (Structured sleeve, fold lines, and white cuff) -->
  <path d="M72,128 L50,278 C54,285 76,288 80,282 L96,155 Z" fill="url(#blazerNavy)" stroke="#334155" stroke-width="1.8" />
  <path d="M64,198 C68,206 74,204 82,200" stroke="#090d16" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- White cuff peeking out -->
  <path d="M52,274 L78,278 L77,284 L51,280 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

  <!-- Right Arm (Structured sleeve, fold lines, and white cuff) -->
  <path d="M228,128 L250,278 C246,285 224,288 220,282 L204,155 Z" fill="url(#blazerNavy)" stroke="#334155" stroke-width="1.8" />
  <path d="M236,198 C232,206 226,204 218,200" stroke="#090d16" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- White cuff peeking out -->
  <path d="M248,274 L222,278 L223,284 L249,280 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

  <!-- Left Anime Hand (Articulated fingers and thumb contour) -->
  <g transform="translate(48, 282)">
    <path d="M12,0 C7,8 6,18 9,26 C12,30 20,30 23,24 C25,20 25,12 24,0 Z" fill="url(#bodySkinV2)" stroke="#d97706" stroke-width="1.2" />
    <!-- Thumb notch -->
    <path d="M8,8 C4,12 5,18 9,20" stroke="#d97706" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Right Anime Hand (Articulated fingers and thumb contour) -->
  <g transform="translate(222, 282)">
    <path d="M16,0 C21,8 22,18 19,26 C16,30 8,30 5,24 C3,20 3,12 4,0 Z" fill="url(#bodySkinV2)" stroke="#d97706" stroke-width="1.2" />
    <!-- Thumb notch -->
    <path d="M20,8 C24,12 23,18 19,20" stroke="#d97706" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Tailored School Slacks with Crease Lines -->
  <path d="M92,342 L102,552 L141,552 L146,365 L154,365 L159,552 L198,552 L208,342 Z"
        fill="url(#pantsSlate)" stroke="#0f172a" stroke-width="1.8" />
  <!-- Left Leg Center Crease -->
  <line x1="121" y1="355" x2="121" y2="550" stroke="#475569" stroke-width="1.2" />
  <!-- Right Leg Center Crease -->
  <line x1="179" y1="355" x2="179" y2="550" stroke="#475569" stroke-width="1.2" />

  <!-- Polished Loafers / Shoes (with sole rim & specular highlight) -->
  <!-- Left Shoe -->
  <g transform="translate(98, 550)">
    <path d="M0,8 C0,3 12,0 26,0 C40,0 46,6 46,14 C46,21 38,24 24,24 C10,24 0,21 0,14 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
    <path d="M0,18 L46,18 L46,24 L0,24 Z" fill="#1e293b" />
    <ellipse cx="24" cy="7" rx="14" ry="3" fill="#334155" opacity="0.6" />
  </g>
  <!-- Right Shoe -->
  <g transform="translate(156, 550)">
    <path d="M0,14 C0,6 6,0 20,0 C34,0 46,3 46,8 C46,14 36,21 22,24 C8,24 0,21 0,14 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
    <path d="M0,18 L46,18 L46,24 L0,24 Z" fill="#1e293b" />
    <ellipse cx="22" cy="7" rx="14" ry="3" fill="#334155" opacity="0.6" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500">
  <defs>
    <linearGradient id="outdoorSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="windowFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="winShadow" x="-10" y="-10" width="500" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Window Frame with Drop Shadow -->
  <rect x="12" y="10" width="456" height="476" rx="6" fill="url(#windowFrameGrad)" filter="url(#winShadow)"/>
  <rect x="12" y="10" width="456" height="3" fill="white"/>

  <!-- Outdoor Scenery Canvas (Inside Window) -->
  <g id="outdoorView">
    <!-- Sky Background -->
    <rect x="28" y="26" width="424" height="444" rx="2" fill="url(#outdoorSky)"/>

    <!-- Distant Soft Fluffy Clouds -->
    <path d="M 120 180 Q 140 140 180 150 Q 220 130 250 160 Q 280 150 300 180 Z" fill="white" opacity="0.65"/>
    <path d="M 240 240 Q 260 210 290 220 Q 320 200 350 230 Q 370 220 390 250 Z" fill="white" opacity="0.5"/>

    <!-- Cherry Blossom Branch Dipping In from Top Right -->
    <g id="cherryBranch">
      <!-- Dark Wood Branch -->
      <path d="M 452 40 Q 360 80 300 60 Q 240 45 190 90" fill="none" stroke="#451a03" stroke-width="12" stroke-linecap="round"/>
      <path d="M 330 68 Q 280 120 230 130" fill="none" stroke="#451a03" stroke-width="7" stroke-linecap="round"/>
      <path d="M 230 80 Q 180 60 140 75" fill="none" stroke="#5c2c06" stroke-width="5" stroke-linecap="round"/>

      <!-- Clusters of Sakura Blossoms -->
      <!-- Cluster 1 (Left end) -->
      <circle cx="140" cy="75" r="16" fill="#f43f5e" opacity="0.4"/>
      <circle cx="136" cy="72" r="14" fill="#fda4af"/>
      <circle cx="150" cy="65" r="13" fill="#fecdd3"/>
      <circle cx="142" cy="85" r="12" fill="#ffe4e6"/>
      <circle cx="142" cy="74" r="3" fill="#f43f5e"/>

      <!-- Cluster 2 (Mid branch) -->
      <circle cx="210" cy="115" r="18" fill="#fda4af"/>
      <circle cx="230" cy="125" r="16" fill="#fecdd3"/>
      <circle cx="195" cy="130" r="14" fill="#ffe4e6"/>
      <circle cx="215" cy="122" r="4" fill="#e11d48"/>

      <!-- Cluster 3 (Upper right) -->
      <circle cx="280" cy="55" r="22" fill="#fda4af"/>
      <circle cx="310" cy="50" r="20" fill="#fecdd3"/>
      <circle cx="295" cy="75" r="18" fill="#ffe4e6"/>
      <circle cx="295" cy="58" r="4" fill="#e11d48"/>

      <!-- Drifting Loose Petals Outside -->
      <ellipse cx="170" cy="190" rx="6" ry="3" transform="rotate(25 170 190)" fill="#fda4af" opacity="0.85"/>
      <ellipse cx="260" cy="270" rx="7" ry="4" transform="rotate(-35 260 270)" fill="#fecdd3" opacity="0.8"/>
      <ellipse cx="380" cy="330" rx="6" ry="3" transform="rotate(15 380 330)" fill="#fda4af" opacity="0.75"/>
    </g>
  </g>

  <!-- Window Frame Mullions & Transoms (Cross Grid) -->
  <g stroke="#94a3b8" stroke-width="14">
    <!-- Vertical Center Mullion -->
    <line x1="240" y1="26" x2="240" y2="470"/>
    <!-- Horizontal Center Transom -->
    <line x1="28" y1="248" x2="452" y2="248"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" opacity="0.6">
    <line x1="234" y1="26" x2="234" y2="470"/>
    <line x1="28" y1="242" x2="452" y2="242"/>
  </g>

  <!-- Glass Diagonal Specular Sheen across panes -->
  <polygon points="32,28 160,28 32,320" fill="url(#glassReflection)" pointer-events="none"/>
  <polygon points="250,28 420,28 250,440" fill="url(#glassReflection)" pointer-events="none"/>

  <!-- Lower Interior Window Sill -->
  <rect x="8" y="476" width="464" height="18" rx="3" fill="#cbd5e1"/>
  <rect x="8" y="476" width="464" height="3" fill="#ffffff"/>
  <rect x="8" y="492" width="464" height="2" fill="#64748b"/>
</svg>

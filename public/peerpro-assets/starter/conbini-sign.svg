<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Mounting Brackets -->
  <rect x="30" y="140" width="16" height="40" fill="#334155" />
  <rect x="274" y="140" width="16" height="40" fill="#334155" />

  <!-- Main Signboard Box -->
  <rect x="10" y="20" width="300" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Color Stripes: Blue, White, Orange -->
  <path d="M10,20 Q10,20 20,20 L300,20 Q310,20 310,30 L310,60 L10,60 Z" fill="#0284c7" />
  <rect x="10" y="60" width="300" height="50" fill="#ffffff" />
  <path d="M10,110 L310,110 L310,140 Q310,150 300,150 L20,150 Q10,150 10,140 Z" fill="#ea580c" />

  <!-- Japanese Katakana: コンビニ (Conbini) -->
  <text x="160" y="96" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">コンビニ</text>

  <!-- 24 Hours Badge -->
  <rect x="245" y="68" width="50" height="24" rx="4" fill="#16a34a" />
  <text x="270" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">24H</text>
</svg>

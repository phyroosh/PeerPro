<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <linearGradient id="boardFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="boardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="chalkTray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="boardShadow" x="-10" y="-10" width="740" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Drop Shadow and Frame -->
  <rect x="10" y="8" width="700" height="294" rx="6" fill="url(#boardFrame)" filter="url(#boardShadow)"/>
  <rect x="10" y="8" width="700" height="3" fill="#fde68a" opacity="0.35"/>

  <!-- Inner Green Blackboard Slate -->
  <rect x="26" y="24" width="668" height="262" rx="3" fill="url(#boardSurface)"/>
  <!-- Inner Recessed Rim Shadow -->
  <rect x="26" y="24" width="668" height="8" fill="black" opacity="0.25"/>
  <rect x="26" y="24" width="8" height="262" fill="black" opacity="0.2"/>

  <!-- Chalk Diagrams & Notes -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="white" opacity="0.82">
    <!-- Header Title -->
    <text x="50" y="60" font-size="16" font-weight="700" letter-spacing="1">LESSON 4: 2.5D VECTOR KINEMATICS</text>
    <line x1="50" y1="68" x2="360" y2="68" stroke="white" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Coordinate Axes Diagram -->
    <g transform="translate(60, 95)">
      <line x1="20" y1="120" x2="20" y2="10" stroke="white" stroke-width="2"/>
      <line x1="20" y1="120" x2="160" y2="120" stroke="white" stroke-width="2"/>
      <!-- Arrows -->
      <polygon points="20,5 16,15 24,15" fill="white"/>
      <polygon points="165,120 155,116 155,124" fill="white"/>
      <text x="8" y="20" font-size="12" font-style="italic">Y</text>
      <text x="162" y="136" font-size="12" font-style="italic">X</text>

      <!-- Vector trajectory curve -->
      <path d="M 20 120 Q 80 40 145 55" fill="none" stroke="#fef08a" stroke-width="2.5"/>
      <circle cx="145" cy="55" r="4" fill="#fef08a"/>
      <text x="90" y="45" font-size="11" fill="#fef08a">v(t) = (dx, dy)</text>
    </g>

    <!-- Trigonometric & FK Formulas -->
    <g transform="translate(280, 100)">
      <text x="0" y="20" font-size="13" font-family="monospace">armX = rootX + sX - pX</text>
      <text x="0" y="45" font-size="13" font-family="monospace">armY = rootY + sY - pY</text>
      <text x="0" y="70" font-size="13" font-family="monospace">θ(t) = A · sin(2πft + φ)</text>
      <text x="0" y="95" font-size="12" fill="#93c5fd">• Fixed Shoulder Anchor</text>
      <text x="0" y="115" font-size="12" fill="#93c5fd">• Zero Socket Detachment</text>
    </g>

    <!-- Japanese Kanji Class Header -->
    <text x="560" y="60" font-size="15" fill="#fca5a5" font-weight="bold">第4講 • 物理</text>
    <!-- Geometric Box Sketch -->
    <g transform="translate(540, 90)" stroke="white" stroke-width="1.5" fill="none" opacity="0.6">
      <rect x="10" y="20" width="70" height="50"/>
      <rect x="30" y="0" width="70" height="50"/>
      <line x1="10" y1="20" x2="30" y2="0"/>
      <line x1="80" y1="20" x2="100" y2="0"/>
      <line x1="10" y1="70" x2="30" y2="50"/>
      <line x1="80" y1="70" x2="100" y2="50"/>
    </g>
  </g>

  <!-- Erased Chalk Dust Texture Haze -->
  <ellipse cx="220" cy="180" rx="90" ry="35" fill="white" opacity="0.06"/>
  <ellipse cx="480" cy="140" rx="120" ry="45" fill="white" opacity="0.05"/>

  <!-- Metal Chalk Tray / Rail at Bottom -->
  <rect x="20" y="296" width="680" height="14" rx="2" fill="url(#chalkTray)"/>
  <rect x="20" y="296" width="680" height="2" fill="#f8fafc" opacity="0.7"/>

  <!-- Chalk Sticks in Tray -->
  <rect x="60" y="294" width="28" height="5" rx="2" fill="#ffffff"/>
  <rect x="94" y="294" width="24" height="5" rx="2" fill="#fef08a"/>
  <rect x="124" y="294" width="22" height="5" rx="2" fill="#60a5fa"/>

  <!-- Felt Chalkboard Eraser -->
  <g transform="translate(580, 290)">
    <!-- Wooden Grip -->
    <rect x="0" y="0" width="55" height="7" rx="2" fill="#78350f"/>
    <!-- Felt Pad -->
    <rect x="0" y="7" width="55" height="5" rx="1" fill="#1e293b"/>
    <!-- Chalk Dust on felt -->
    <rect x="10" y="10" width="35" height="2" fill="white" opacity="0.5"/>
  </g>
</svg>

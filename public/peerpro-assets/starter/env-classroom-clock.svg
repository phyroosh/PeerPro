<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="clockBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="clockShadow" x="-10" y="-10" width="140" height="140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Bezel Ring with Shadow -->
  <circle cx="60" cy="60" r="54" fill="url(#clockBezel)" filter="url(#clockShadow)"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.8"/>
  <circle cx="60" cy="60" r="47" fill="#475569"/>

  <!-- Clock Dial Face -->
  <circle cx="60" cy="60" r="45" fill="#ffffff"/>
  <!-- Dial Inner Rim Shadow -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.15"/>

  <!-- Hour Numerals (12, 3, 6, 9) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#1e293b" text-anchor="middle" dominant-baseline="central">
    <text x="60" y="24">12</text>
    <text x="96" y="60">3</text>
    <text x="60" y="96">6</text>
    <text x="24" y="60">9</text>
  </g>

  <!-- 12 Hour Ticks -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="16" x2="60" y2="20"/>
    <line x1="82" y1="22" x2="80" y2="25.5"/>
    <line x1="98" y1="38" x2="94.5" y2="40"/>
    <line x1="104" y1="60" x2="100" y2="60"/>
    <line x1="98" y1="82" x2="94.5" y2="80"/>
    <line x1="82" y1="98" x2="80" y2="94.5"/>
    <line x1="60" y1="104" x2="60" y2="100"/>
    <line x1="38" y1="98" x2="40" y2="94.5"/>
    <line x1="22" y1="82" x2="25.5" y2="80"/>
    <line x1="16" y1="60" x2="20" y2="60"/>
    <line x1="22" y1="38" x2="25.5" y2="40"/>
    <line x1="38" y1="22" x2="40" y2="25.5"/>
  </g>

  <!-- Clock Hands (3:15:30 PM) -->
  <!-- Hour Hand: Points slightly past 3 o'clock (towards 98 degrees) -->
  <line x1="60" y1="60" x2="83" y2="64" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Minute Hand: Points at 15 minutes / 3 o'clock (90 degrees) -->
  <line x1="60" y1="60" x2="94" y2="60" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Second Hand: Red sweep hand pointing down towards 6 o'clock (180 degrees) -->
  <line x1="60" y1="68" x2="60" y2="98" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Counterweight -->
  <line x1="60" y1="60" x2="60" y2="52" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Pin Boss -->
  <circle cx="60" cy="60" r="3.5" fill="#0f172a"/>
  <circle cx="60" cy="60" r="1.5" fill="#ef4444"/>

  <!-- Glass Highlight Reflection Arc -->
  <path d="M 28 32 A 42 42 0 0 1 92 32" fill="none" stroke="white" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 380" width="1920" height="380">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="35%" stop-color="#a16207"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="floorSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.0"/>
      <stop offset="25%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="75%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base Floor Surface -->
  <rect x="0" y="0" width="1920" height="380" fill="url(#floorGrad)"/>

  <!-- Perspective Floor Planks (Converging towards horizon at ~540px) -->
  <g stroke="#5c2c06" stroke-width="2.5" opacity="0.6">
    <!-- Center Planks -->
    <line x1="960" y1="0" x2="960" y2="380"/>
    <line x1="880" y1="0" x2="820" y2="380"/>
    <line x1="1040" y1="0" x2="1100" y2="380"/>

    <!-- Mid Left Planks -->
    <line x1="800" y1="0" x2="680" y2="380"/>
    <line x1="720" y1="0" x2="540" y2="380"/>
    <line x1="640" y1="0" x2="400" y2="380"/>
    <line x1="560" y1="0" x2="260" y2="380"/>
    <line x1="480" y1="0" x2="120" y2="380"/>
    <line x1="400" y1="0" x2="-20" y2="380"/>
    <line x1="320" y1="0" x2="-160" y2="380"/>

    <!-- Mid Right Planks -->
    <line x1="1120" y1="0" x2="1240" y2="380"/>
    <line x1="1200" y1="0" x2="1380" y2="380"/>
    <line x1="1280" y1="0" x2="1520" y2="380"/>
    <line x1="1360" y1="0" x2="1660" y2="380"/>
    <line x1="1440" y1="0" x2="1800" y2="380"/>
    <line x1="1520" y1="0" x2="1940" y2="380"/>
    <line x1="1600" y1="0" x2="2080" y2="380"/>
  </g>

  <!-- Horizontal Staggered Plank Joint Lines -->
  <g stroke="#451a03" stroke-width="1.8" opacity="0.45">
    <line x1="100" y1="65" x2="320" y2="65"/>
    <line x1="580" y1="75" x2="840" y2="75"/>
    <line x1="1100" y1="60" x2="1400" y2="60"/>
    <line x1="1620" y1="70" x2="1880" y2="70"/>

    <line x1="0" y1="145" x2="240" y2="145"/>
    <line x1="420" y1="155" x2="720" y2="155"/>
    <line x1="900" y1="140" x2="1220" y2="140"/>
    <line x1="1380" y1="150" x2="1740" y2="150"/>

    <line x1="180" y1="230" x2="480" y2="230"/>
    <line x1="680" y1="240" x2="1040" y2="240"/>
    <line x1="1200" y1="225" x2="1560" y2="225"/>
    <line x1="1700" y1="235" x2="1920" y2="235"/>

    <line x1="50" y1="315" x2="400" y2="315"/>
    <line x1="550" y1="325" x2="980" y2="325"/>
    <line x1="1140" y1="310" x2="1600" y2="310"/>
  </g>

  <!-- Ambient Light Reflection Sheen -->
  <rect x="0" y="0" width="1920" height="380" fill="url(#floorSheen)" pointer-events="none"/>

  <!-- Top Baseboard Contact Line -->
  <line x1="0" y1="1" x2="1920" y2="1" stroke="#3b1d07" stroke-width="3"/>
  <line x1="0" y1="3" x2="1920" y2="3" stroke="#fef08a" stroke-width="1" opacity="0.3"/>
</svg>

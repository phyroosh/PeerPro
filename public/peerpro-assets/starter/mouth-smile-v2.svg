<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40" width="80" height="40">
  <defs>
    <!-- Soft lip shadow -->
    <linearGradient id="lipShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Smile curve -->
  <path d="M12,14 Q40,28 68,14" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Corner smile dimples -->
  <path d="M11,12 L14,16" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M69,12 L66,16" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round" />
  <!-- Lower lip accent shadow -->
  <path d="M30,26 Q40,30 50,26" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>

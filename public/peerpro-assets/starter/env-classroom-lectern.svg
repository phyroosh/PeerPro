<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" width="200" height="360">
  <defs>
    <linearGradient id="podiumWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="30%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="podiumHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="lecternShadow" x="-20" y="335" width="240" height="30" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="100" cy="348" rx="85" ry="9" fill="#0f172a" opacity="0.35" filter="url(#lecternShadow)"/>

  <!-- Lower Base Plinth -->
  <rect x="25" y="330" width="150" height="20" rx="3" fill="#451a03"/>
  <rect x="25" y="330" width="150" height="3" fill="#b45309"/>

  <!-- Central Column Body -->
  <rect x="40" y="70" width="120" height="262" rx="4" fill="url(#podiumWood)"/>
  <!-- Recessed Front Inset Panel -->
  <rect x="52" y="85" width="96" height="232" rx="3" fill="#581c87" opacity="0.12"/>
  <rect x="52" y="85" width="96" height="232" rx="3" fill="none" stroke="#92400e" stroke-width="2.5"/>
  <rect x="54" y="87" width="92" height="4" fill="#3b1d07" opacity="0.6"/>

  <!-- Middle Shelf Shadow -->
  <rect x="36" y="66" width="128" height="6" fill="#1e293b" opacity="0.3"/>

  <!-- Slanted Reading Surface Rest -->
  <polygon points="10,65 190,65 180,25 20,25" fill="url(#podiumHighlight)"/>
  <!-- Lip Ledge to catch books -->
  <rect x="8" y="60" width="184" height="10" rx="2" fill="#78350f"/>
  <rect x="8" y="60" width="184" height="2" fill="#fde68a" opacity="0.5"/>

  <!-- Document / Class Syllabus on Reading Surface -->
  <polygon points="50,56 145,56 140,32 55,32" fill="#ffffff" opacity="0.95"/>
  <!-- Text lines on document -->
  <line x1="62" y1="38" x2="132" y2="38" stroke="#64748b" stroke-width="2"/>
  <line x1="62" y1="44" x2="128" y2="44" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="62" y1="50" x2="115" y2="50" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Blue Paper Binder Clip at top of document -->
  <rect x="92" y="28" width="12" height="6" rx="1.5" fill="#2563eb"/>
  <circle cx="98" cy="30" r="1.5" fill="#93c5fd"/>
</svg>

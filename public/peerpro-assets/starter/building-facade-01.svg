<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Main Building Body -->
  <rect x="20" y="40" width="560" height="760" fill="url(#wallGrad)" stroke="#475569" stroke-width="4" />

  <!-- Roof Parapet -->
  <rect x="10" y="20" width="580" height="25" rx="4" fill="#64748b" />

  <!-- Upper Windows Grid -->
  <g fill="url(#glassGrad)" stroke="#1e293b" stroke-width="3">
    <!-- Floor 3 -->
    <rect x="60" y="80" width="100" height="120" rx="4" />
    <rect x="190" y="80" width="100" height="120" rx="4" />
    <rect x="320" y="80" width="100" height="120" rx="4" />
    <rect x="450" y="80" width="100" height="120" rx="4" />

    <!-- Floor 2 -->
    <rect x="60" y="240" width="100" height="120" rx="4" />
    <rect x="190" y="240" width="100" height="120" rx="4" />
    <rect x="320" y="240" width="100" height="120" rx="4" />
    <rect x="450" y="240" width="100" height="120" rx="4" />

    <!-- Floor 1 -->
    <rect x="60" y="400" width="100" height="120" rx="4" />
    <rect x="190" y="400" width="100" height="120" rx="4" />
    <rect x="320" y="400" width="100" height="120" rx="4" />
    <rect x="450" y="400" width="100" height="120" rx="4" />
  </g>

  <!-- Storefront Awning (Ground Floor) -->
  <polygon points="40,560 560,560 580,620 20,620" fill="#f59e0b" stroke="#b45309" stroke-width="3" />
  <!-- Awning Stripes -->
  <polygon points="120,560 180,560 170,620 110,620" fill="#dc2626" />
  <polygon points="260,560 320,560 310,620 250,620" fill="#dc2626" />
  <polygon points="400,560 460,560 450,620 390,620" fill="#dc2626" />

  <!-- Storefront Entrance & Large Windows -->
  <rect x="50" y="630" width="220" height="170" fill="url(#glassGrad)" stroke="#475569" stroke-width="4" />
  <rect x="310" y="630" width="240" height="170" fill="url(#glassGrad)" stroke="#475569" stroke-width="4" />
  <!-- Glass Reflections -->
  <line x1="70" y1="640" x2="160" y2="780" stroke="#ffffff" stroke-width="4" opacity="0.4" />
  <line x1="330" y1="640" x2="420" y2="780" stroke="#ffffff" stroke-width="4" opacity="0.4" />
</svg>

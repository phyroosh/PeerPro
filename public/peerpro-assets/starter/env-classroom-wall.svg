<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wallPlaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="wainscotWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="25%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="panelSlats" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="ceilingTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="softWallShadow" x="0" y="0" width="1920" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Upper Plaster Wall -->
  <rect x="0" y="0" width="1920" height="660" fill="url(#wallPlaster)"/>

  <!-- Top Ceiling Trim Molding -->
  <rect x="0" y="0" width="1920" height="42" fill="url(#ceilingTrim)"/>
  <rect x="0" y="40" width="1920" height="3" fill="#64748b"/>
  <!-- Ambient Shadow cast by ceiling -->
  <rect x="0" y="43" width="1920" height="35" fill="black" opacity="0.04"/>

  <!-- Lower Wainscoting Background -->
  <rect x="0" y="660" width="1920" height="420" fill="url(#wainscotWood)"/>

  <!-- Wainscot Top Rail Molding (Chair Rail) -->
  <rect x="0" y="640" width="1920" height="24" fill="#a16207" filter="url(#softWallShadow)"/>
  <rect x="0" y="640" width="1920" height="4" fill="#fde68a" opacity="0.4"/>
  <rect x="0" y="662" width="1920" height="4" fill="#451a03"/>

  <!-- Recessed Vertical Wainscot Wood Panels (Pattern across 1920px) -->
  <g opacity="0.85">
    <!-- Panel 1 -->
    <rect x="60" y="680" width="220" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="64" y="684" width="212" height="352" rx="3" fill="#854d0e"/>
    <!-- Panel 2 -->
    <rect x="320" y="680" width="220" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="324" y="684" width="212" height="352" rx="3" fill="#854d0e"/>
    <!-- Panel 3 -->
    <rect x="580" y="680" width="220" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="584" y="684" width="212" height="352" rx="3" fill="#854d0e"/>
    <!-- Panel 4 -->
    <rect x="840" y="680" width="240" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="844" y="684" width="232" height="352" rx="3" fill="#854d0e"/>
    <!-- Panel 5 -->
    <rect x="1120" y="680" width="220" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="1124" y="684" width="212" height="352" rx="3" fill="#854d0e"/>
    <!-- Panel 6 -->
    <rect x="1380" y="680" width="220" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="1384" y="684" width="212" height="352" rx="3" fill="#854d0e"/>
    <!-- Panel 7 -->
    <rect x="1640" y="680" width="220" height="360" rx="4" fill="url(#panelSlats)"/>
    <rect x="1644" y="684" width="212" height="352" rx="3" fill="#854d0e"/>
  </g>

  <!-- Bottom Wall Baseboard Trim -->
  <rect x="0" y="1046" width="1920" height="34" fill="#3b1d07"/>
  <rect x="0" y="1046" width="1920" height="4" fill="#78350f"/>
</svg>

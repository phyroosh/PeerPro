<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="aptWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="balconySteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="warmWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Main Apartment Structure -->
  <rect x="20" y="30" width="460" height="720" fill="url(#aptWall)" stroke="#1e293b" stroke-width="3" />

  <!-- Roof Railing -->
  <rect x="10" y="15" width="480" height="18" rx="3" fill="#64748b" />

  <!-- Floor 3 Balcony & Windows -->
  <rect x="50" y="70" width="160" height="110" rx="4" fill="url(#warmWindow)" opacity="0.8" />
  <rect x="290" y="70" width="160" height="110" rx="4" fill="#1e293b" />
  <!-- AC Unit -->
  <rect x="220" y="140" width="50" height="36" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
  <circle cx="235" cy="158" r="10" fill="#94a3b8" />
  <!-- Balcony Railing Floor 3 -->
  <rect x="40" y="150" width="420" height="40" fill="url(#balconySteel)" stroke="#334155" stroke-width="2" />
  <line x1="100" y1="150" x2="100" y2="190" stroke="#1e293b" stroke-width="2" />
  <line x1="200" y1="150" x2="200" y2="190" stroke="#1e293b" stroke-width="2" />
  <line x1="300" y1="150" x2="300" y2="190" stroke="#1e293b" stroke-width="2" />
  <line x1="400" y1="150" x2="400" y2="190" stroke="#1e293b" stroke-width="2" />

  <!-- Floor 2 Balcony & Windows -->
  <rect x="50" y="250" width="160" height="110" rx="4" fill="#1e293b" />
  <rect x="290" y="250" width="160" height="110" rx="4" fill="url(#warmWindow)" opacity="0.9" />
  <!-- AC Unit Floor 2 -->
  <rect x="220" y="320" width="50" height="36" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
  <circle cx="235" cy="338" r="10" fill="#94a3b8" />
  <!-- Balcony Railing Floor 2 -->
  <rect x="40" y="330" width="420" height="40" fill="url(#balconySteel)" stroke="#334155" stroke-width="2" />
  <line x1="100" y1="330" x2="100" y2="370" stroke="#1e293b" stroke-width="2" />
  <line x1="200" y1="330" x2="200" y2="370" stroke="#1e293b" stroke-width="2" />
  <line x1="300" y1="330" x2="300" y2="370" stroke="#1e293b" stroke-width="2" />
  <line x1="400" y1="330" x2="400" y2="370" stroke="#1e293b" stroke-width="2" />

  <!-- Floor 1 Balcony & Windows -->
  <rect x="50" y="430" width="160" height="110" rx="4" fill="url(#warmWindow)" opacity="0.85" />
  <rect x="290" y="430" width="160" height="110" rx="4" fill="#1e293b" />
  <!-- Balcony Railing Floor 1 -->
  <rect x="40" y="510" width="420" height="40" fill="url(#balconySteel)" stroke="#334155" stroke-width="2" />
  <line x1="100" y1="510" x2="100" y2="550" stroke="#1e293b" stroke-width="2" />
  <line x1="200" y1="510" x2="200" y2="550" stroke="#1e293b" stroke-width="2" />
  <line x1="300" y1="510" x2="300" y2="550" stroke="#1e293b" stroke-width="2" />
  <line x1="400" y1="510" x2="400" y2="550" stroke="#1e293b" stroke-width="2" />

  <!-- Ground Floor Entrance & Garage Door -->
  <rect x="50" y="600" width="180" height="150" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
  <!-- Slatted Garage Shutter -->
  <line x1="50" y1="630" x2="230" y2="630" stroke="#475569" stroke-width="2" />
  <line x1="50" y1="660" x2="230" y2="660" stroke="#475569" stroke-width="2" />
  <line x1="50" y1="690" x2="230" y2="690" stroke="#475569" stroke-width="2" />
  <line x1="50" y1="720" x2="230" y2="720" stroke="#475569" stroke-width="2" />

  <!-- Entrance Doorway & Lantern -->
  <rect x="290" y="600" width="150" height="150" fill="#0f172a" rx="4" />
  <rect x="310" y="620" width="110" height="130" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <circle cx="400" cy="685" r="4" fill="#f8fafc" />
  <rect x="260" y="620" width="18" height="30" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" /> <!-- Doorway Light -->
</svg>

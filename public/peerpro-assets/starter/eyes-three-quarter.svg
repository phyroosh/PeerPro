<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60">
  <defs>
    <!-- 3/4 Anime Iris Gradient -->
    <linearGradient id="irisGrad3Q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="irisReflect3Q" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- FORESHORTENED LEFT EYE (Foreshortened in 3/4 angle) -->
  <g transform="translate(24, 10)">
    <!-- Eye White -->
    <path d="M2,22 C6,13 22,12 26,22 C22,30 6,30 2,22 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
    <path d="M2,22 C6,13 22,12 26,22 C22,18 8,18 2,22 Z" fill="#94a3b8" opacity="0.3" />
    <!-- Foreshortened Iris -->
    <ellipse cx="15" cy="22" rx="9" ry="13" fill="url(#irisGrad3Q)" />
    <ellipse cx="15" cy="25" rx="6" ry="7" fill="url(#irisReflect3Q)" />
    <circle cx="15" cy="21" r="3.5" fill="#090d16" />
    <!-- Highlights -->
    <circle cx="13" cy="17" r="2.8" fill="#ffffff" />
    <circle cx="17" cy="25" r="1.5" fill="#ffffff" opacity="0.9" />
    <!-- Lashline -->
    <path d="M0,22 C4,10 24,9 28,18 L26,20 C20,12 6,13 1,24 Z" fill="#0f172a" />
    <!-- Double Eyelid -->
    <path d="M4,8 C12,5 20,6 24,11" stroke="#334155" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- PROMINENT RIGHT EYE (Facing closer to camera in 3/4 angle) -->
  <g transform="translate(82, 8)">
    <!-- Eye White -->
    <path d="M4,24 C12,12 38,14 44,24 C38,34 12,34 4,24 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
    <path d="M4,24 C12,12 38,14 44,24 C36,20 12,20 4,24 Z" fill="#94a3b8" opacity="0.3" />
    <!-- Iris -->
    <ellipse cx="24" cy="24" rx="14" ry="14" fill="url(#irisGrad3Q)" />
    <ellipse cx="24" cy="27" rx="10" ry="8" fill="url(#irisReflect3Q)" />
    <circle cx="24" cy="23" r="5" fill="#090d16" />
    <!-- Highlights -->
    <circle cx="20" cy="18" r="4" fill="#ffffff" />
    <circle cx="28" cy="27" r="2" fill="#ffffff" opacity="0.9" />
    <!-- Lashline -->
    <path d="M0,18 C10,8 42,10 48,24 L46,26 C38,14 12,13 2,21 Z" fill="#0f172a" />
    <!-- Double Eyelid -->
    <path d="M8,11 C16,5 30,4 40,8" stroke="#334155" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M12,32 C18,35 28,36 36,34" stroke="#0f172a" stroke-width="1" stroke-linecap="round" fill="none" />
  </g>
</svg>

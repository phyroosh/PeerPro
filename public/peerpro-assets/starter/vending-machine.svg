<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 300" width="160" height="300">
  <defs>
    <linearGradient id="vmBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="vmGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Legs -->
  <rect x="18" y="285" width="24" height="15" fill="#1e293b" rx="2" />
  <rect x="118" y="285" width="24" height="15" fill="#1e293b" rx="2" />

  <!-- Main Machine Body (Iconic Red) -->
  <rect x="10" y="10" width="140" height="275" rx="8" fill="url(#vmBody)" stroke="#7f1d1d" stroke-width="2" />

  <!-- Top Display Canopy / Header -->
  <rect x="18" y="20" width="124" height="25" rx="4" fill="#ffffff" />
  <text x="80" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#dc2626" text-anchor="middle">COLD &amp; HOT</text>

  <!-- Drink Selection Display Window -->
  <rect x="18" y="52" width="124" height="120" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2" filter="url(#vmGlow)" />

  <!-- Row 1 Cans -->
  <rect x="25" y="62" width="16" height="26" rx="2" fill="#38bdf8" />
  <rect x="47" y="62" width="16" height="26" rx="2" fill="#22c55e" />
  <rect x="69" y="62" width="16" height="26" rx="2" fill="#f59e0b" />
  <rect x="91" y="62" width="16" height="26" rx="2" fill="#ec4899" />
  <rect x="113" y="62" width="16" height="26" rx="2" fill="#ffffff" />
  <!-- Row 1 Buttons -->
  <circle cx="33" cy="95" r="3.5" fill="#3b82f6" />
  <circle cx="55" cy="95" r="3.5" fill="#22c55e" />
  <circle cx="77" cy="95" r="3.5" fill="#3b82f6" />
  <circle cx="99" cy="95" r="3.5" fill="#ef4444" />
  <circle cx="121" cy="95" r="3.5" fill="#3b82f6" />

  <!-- Row 2 Cans -->
  <rect x="25" y="112" width="16" height="26" rx="2" fill="#eab308" />
  <rect x="47" y="112" width="16" height="26" rx="2" fill="#ef4444" />
  <rect x="69" y="112" width="16" height="26" rx="2" fill="#06b6d4" />
  <rect x="91" y="112" width="16" height="26" rx="2" fill="#a855f7" />
  <rect x="113" y="112" width="16" height="26" rx="2" fill="#f97316" />
  <!-- Row 2 Buttons -->
  <circle cx="33" cy="145" r="3.5" fill="#ef4444" />
  <circle cx="55" cy="145" r="3.5" fill="#ef4444" />
  <circle cx="77" cy="145" r="3.5" fill="#3b82f6" />
  <circle cx="99" cy="145" r="3.5" fill="#3b82f6" />
  <circle cx="121" cy="145" r="3.5" fill="#ef4444" />

  <!-- Payment / Coin Slot Panel -->
  <rect x="100" y="185" width="42" height="45" rx="3" fill="#1e293b" />
  <rect x="108" y="193" width="26" height="4" fill="#ffffff" /> <!-- Coin Slot -->
  <rect x="112" y="206" width="18" height="15" fill="#0284c7" /> <!-- Digital Display -->

  <!-- Dispenser Door -->
  <rect x="25" y="240" width="110" height="36" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="35" y="246" width="90" height="24" rx="2" fill="#0f172a" />
</svg>
